# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-purifier"
version = "0.0.0.dev0"
description = "A Poetry plugin that locks the files Poetry downloads, so that Nix can build the project offline"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["poetry>=2.0"]

[project.entry-points."poetry.application.plugin"]
purifier = "poetry_purifier.plugin:PurifierPlugin"


[tool.setuptools.packages.find]
where = ["src"]
